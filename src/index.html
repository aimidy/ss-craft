<!doctype html>
<html lang="zh-Hant">
    <head>
        <title>料理材料計算器</title>

        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <link rel="icon" href="./favicon.ico" type="image/x-icon" />

        <!-- Font -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600&display=swap"
            rel="stylesheet"
        />

        <!-- Pure CSS (no Tailwind) -->
        <link rel="stylesheet" href="./styles.css" />
    </head>

    <body class="font-sans text-cocoa-900">
        <div class="mx-auto max-w-5xl px-4 py-8">
            <div class="page-header">
                <div>
                    <h1 class="text-2xl font-semibold tracking-tight">🍽️ 料理材料計算器</h1>
                    <p class="mt-2 text-sm text-slate-600">
                        選料理 → 加入清單 → 調整份數 → 自動算總材料
                    </p>
                </div>

                <!-- Legend -->
                <div class="legend text-xs text-slate-600">
                    <span class="legend-chip">
                        <span class="legend-dot bg-amber-400"></span>
                        金色
                    </span>
                    <span class="legend-chip">
                        <span class="legend-dot bg-orange-500"></span>
                        橙色
                    </span>
                    <span class="legend-chip">
                        <span class="legend-dot bg-violet-500"></span>
                        紫色
                    </span>
                </div>
            </div>

            <!-- Controls -->
            <div class="mt-6 card rounded-2xl p-5">
                <!-- 篩選區域 -->
                <div class="mb-4 pb-4 border-b border-slate-200">
                    <div class="row mb-3">
                        <span class="text-xs font-medium text-slate-700">品質篩選：</span>
                        <div class="row">
                            <button
                                id="filterAll"
                                class="quality-filter-btn active border border-slate-400 bg-slate-100 text-cocoa-900"
                                data-quality="all"
                            >
                                全部
                            </button>
                            <button
                                id="filterGold"
                                class="quality-filter-btn border border-slate-300 bg-white text-slate-700"
                                data-quality="金色"
                            >
                                🟡 金色
                            </button>
                            <button
                                id="filterOrange"
                                class="quality-filter-btn border border-slate-300 bg-white text-slate-700"
                                data-quality="橙色"
                            >
                                🟠 橙色
                            </button>
                            <button
                                id="filterPurple"
                                class="quality-filter-btn border border-slate-300 bg-white text-slate-700"
                                data-quality="紫色"
                            >
                                🟣 紫色
                            </button>
                        </div>
                    </div>

                    <div class="row mb-3">
                        <span class="text-xs font-medium text-slate-700">屬性篩選：</span>
                        <div class="row">
                            <button
                                id="attrAll"
                                class="attr-filter-btn active border border-slate-400 bg-slate-100 text-cocoa-900"
                                data-attr="all"
                            >
                                全部
                            </button>
                            <button
                                id="attrHP"
                                class="attr-filter-btn border border-slate-300 bg-white text-slate-700"
                                data-attr="生命"
                            >
                                生命
                            </button>
                            <button
                                id="attrATK"
                                class="attr-filter-btn border border-slate-300 bg-white text-slate-700"
                                data-attr="攻擊"
                            >
                                攻擊
                            </button>
                            <button
                                id="attrDEF"
                                class="attr-filter-btn border border-slate-300 bg-white text-slate-700"
                                data-attr="防禦"
                            >
                                防禦
                            </button>
                        </div>
                    </div>

                    <div class="row">
                        <span class="text-xs font-medium text-slate-700">搜尋：</span>
                        <input
                            id="recipeSearch"
                            type="text"
                            placeholder="輸入料理名稱搜尋..."
                            class="input min-w-240"
                        />
                    </div>
                </div>

                <!-- 料理列表 -->
                <div class="space-y-3">
                    <div class="col gap-1">
                        <span class="text-xs font-medium text-slate-700">選擇料理</span>
                        <div class="row">
                            <select id="recipeSelect" class="select flex-1 min-w-260"></select>
                            <!-- selected quality badge (script.js will fill) -->
                            <span id="selectedQualityBadge" class="hidden"></span>
                        </div>
                    </div>

                    <div class="mt-3 row justify-between">
                        <span id="status" class="text-sm text-slate-600 flex-1"></span>
                        <div class="row">
                            <button id="addBtn" class="btn btn-primary">加入清單</button>
                            <button id="clearBtn" class="btn btn-ghost" title="清空所有已選料理">
                                清空
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Selected -->
            <div class="mt-6 card rounded-2xl p-5">
                <div class="row justify-between">
                    <h2 class="text-lg font-semibold">🧾 已選料理（可調整份數）</h2>
                </div>

                <div id="selectedEmpty" class="mt-3 text-sm text-slate-600">
                    目前還沒選任何料理喔～
                </div>

                <div id="selectedTableWrap" class="mt-4 overflow-x-auto hidden">
                    <table class="min-w-full text-sm table-row-hover">
                        <thead>
                            <tr class="table-head">
                                <th class="px-3 py-3 font-medium th-w-name">料理（含品質）</th>
                                <th class="px-3 py-3 font-medium th-w-160">份數</th>
                                <th class="px-3 py-3 font-medium">材料明細（依份數縮放）</th>
                                <th class="px-3 py-3 font-medium th-w-96"></th>
                            </tr>
                        </thead>
                        <tbody id="selectedTbody" class="divide-y divide-slate-100"></tbody>
                    </table>
                </div>
            </div>

            <!-- Totals -->
            <div class="mt-6 card rounded-2xl p-5">
                <h2 class="text-lg font-semibold">📦 總材料彙總</h2>

                <div id="totalEmpty" class="mt-3 text-sm text-slate-600">
                    選了料理之後，這裡會列出總共要準備多少材料～
                </div>

                <div id="totalTableWrap" class="mt-4 overflow-x-auto hidden">
                    <table class="min-w-full text-sm table-row-hover">
                        <thead>
                            <tr class="table-head">
                                <th class="px-3 py-3 font-medium">材料</th>
                                <th class="px-3 py-3 font-medium th-w-160">總數量</th>
                            </tr>
                        </thead>
                        <tbody id="totalTbody" class="divide-y divide-slate-100"></tbody>
                    </table>
                </div>

                <div id="error" class="mt-3 text-sm text-red-700"></div>

                <!-- Cost Calculator -->
                <div class="mt-6 border-t border-slate-200 pt-5">
                    <div class="row justify-between">
                        <h3 class="text-base font-semibold">🧮 成本計算</h3>
                        <div class="text-xs text-slate-500">
                            輸入單價後自動計算：成本 = 總數量 × 單價（單價與已選料理會自動保存）
                        </div>
                    </div>

                    <div class="mt-4 cost-summary">
                        <div class="row">
                            <span class="text-sm text-slate-600">總成本</span>
                            <span id="costTotal" class="text-lg font-semibold tabular-nums">0</span>
                        </div>

                        <button
                            id="clearPricesBtn"
                            class="btn btn-light"
                            title="只清除單價，不影響已選料理"
                        >
                            清除單價
                        </button>
                    </div>

                    <div id="costEmpty" class="mt-3 text-sm text-slate-600">
                        目前沒有材料可以計算成本～
                    </div>

                    <div id="costTableWrap" class="mt-4 overflow-x-auto hidden">
                        <table class="min-w-full text-sm table-row-hover">
                            <thead>
                                <tr class="table-head">
                                    <th class="px-3 py-3 font-medium">材料</th>
                                    <th class="px-3 py-3 font-medium th-w-120">總數量</th>
                                    <th class="px-3 py-3 font-medium th-w-180">單價</th>
                                    <th class="px-3 py-3 font-medium th-w-160">材料成本</th>
                                </tr>
                            </thead>
                            <tbody id="costTbody" class="divide-y divide-slate-100"></tbody>
                        </table>
                    </div>
                </div>
                <!-- Cost Calculator END -->
            </div>
        </div>

        <script src="./script.js"></script>
    </body>
</html>
